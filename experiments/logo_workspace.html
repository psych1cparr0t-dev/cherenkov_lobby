<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cherenkov Logo Dev Workspace</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #0a0a0f;
            color: #e0e0e0;
            font-family: 'Inter', system-ui, sans-serif;
            overflow: hidden;
            height: 100vh;
        }

        /* ─── Layout ─────────────────────────────────── */
        #app {
            display: flex;
            height: 100vh;
        }

        #canvas-area {
            flex: 1;
            position: relative;
            background:
                radial-gradient(circle at 50% 50%, rgba(30, 40, 60, 0.3) 0%, transparent 70%),
                repeating-linear-gradient(0deg, transparent, transparent 19px, rgba(255, 255, 255, 0.03) 19px, rgba(255, 255, 255, 0.03) 20px),
                repeating-linear-gradient(90deg, transparent, transparent 19px, rgba(255, 255, 255, 0.03) 19px, rgba(255, 255, 255, 0.03) 20px);
        }

        #logo-svg {
            width: 100%;
            height: 100%;
        }

        /* ─── Sidebar ────────────────────────────────── */
        #sidebar {
            width: 280px;
            background: rgba(15, 15, 22, 0.95);
            border-left: 1px solid rgba(255, 255, 255, 0.06);
            display: flex;
            flex-direction: column;
            overflow-y: auto;
        }

        #sidebar h2 {
            padding: 16px 18px 10px;
            font-size: 0.7rem;
            font-weight: 600;
            letter-spacing: 0.15em;
            text-transform: uppercase;
            color: rgba(255, 255, 255, 0.4);
        }

        /* ─── Element List ────────────────────────────── */
        .element-item {
            padding: 10px 18px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.04);
            cursor: pointer;
            transition: background 0.15s;
            font-size: 0.8rem;
        }

        .element-item:hover {
            background: rgba(255, 255, 255, 0.04);
        }

        .element-item.selected {
            background: rgba(80, 130, 255, 0.12);
            border-left: 2px solid #5088ff;
        }

        .element-item .label {
            font-weight: 500;
            color: rgba(255, 255, 255, 0.85);
        }

        .element-item .coords {
            font-size: 0.65rem;
            color: rgba(255, 255, 255, 0.3);
            margin-top: 3px;
            font-family: 'SF Mono', monospace;
        }

        /* ─── Controls ───────────────────────────────── */
        .controls-section {
            padding: 14px 18px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.04);
        }

        .control-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 8px;
        }

        .control-row label {
            font-size: 0.7rem;
            color: rgba(255, 255, 255, 0.5);
            letter-spacing: 0.05em;
        }

        .control-row input[type="range"] {
            width: 120px;
            accent-color: #5088ff;
        }

        .control-row .val {
            font-size: 0.65rem;
            color: rgba(255, 255, 255, 0.35);
            width: 40px;
            text-align: right;
            font-family: 'SF Mono', monospace;
        }

        /* ─── Recording Panel ─────────────────────────── */
        #recording-panel {
            margin-top: auto;
            padding: 14px 18px;
            border-top: 1px solid rgba(255, 255, 255, 0.06);
        }

        .btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 8px 14px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 6px;
            background: rgba(255, 255, 255, 0.04);
            color: rgba(255, 255, 255, 0.8);
            font-family: 'Inter', sans-serif;
            font-size: 0.75rem;
            cursor: pointer;
            transition: all 0.15s;
            margin-right: 6px;
            margin-bottom: 6px;
        }

        .btn:hover {
            background: rgba(255, 255, 255, 0.08);
            border-color: rgba(255, 255, 255, 0.2);
        }

        .btn.recording {
            background: rgba(255, 50, 50, 0.15);
            border-color: rgba(255, 50, 50, 0.4);
            color: #ff6666;
        }

        .btn.primary {
            background: rgba(80, 136, 255, 0.15);
            border-color: rgba(80, 136, 255, 0.4);
            color: #88bbff;
        }

        #timeline {
            margin-top: 10px;
            height: 40px;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 6px;
            position: relative;
            overflow: hidden;
        }

        #timeline-bar {
            position: absolute;
            left: 0;
            top: 0;
            bottom: 0;
            width: 0%;
            background: rgba(80, 136, 255, 0.2);
            transition: width 0.1s;
        }

        .keyframe-dot {
            position: absolute;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #5088ff;
            top: 50%;
            transform: translate(-50%, -50%);
            cursor: pointer;
        }

        #frame-count {
            font-size: 0.65rem;
            color: rgba(255, 255, 255, 0.3);
            margin-top: 6px;
            font-family: 'SF Mono', monospace;
        }

        /* ─── SVG element styles ──────────────────────── */
        .draggable {
            cursor: grab;
        }

        .draggable:active {
            cursor: grabbing;
        }

        .draggable.selected-el {
            filter: drop-shadow(0 0 4px rgba(80, 136, 255, 0.6));
        }

        /* ─── Header ──────────────────────────────────── */
        #header {
            position: absolute;
            top: 16px;
            left: 20px;
            z-index: 10;
            pointer-events: none;
        }

        #header h1 {
            font-size: 0.9rem;
            font-weight: 300;
            letter-spacing: 0.15em;
            opacity: 0.5;
        }

        #header p {
            font-size: 0.6rem;
            opacity: 0.25;
            margin-top: 2px;
            letter-spacing: 0.08em;
        }

        /* ─── Reset button ─────────────────────────────── */
        .btn.danger {
            background: rgba(255, 80, 80, 0.1);
            border-color: rgba(255, 80, 80, 0.3);
            color: #ff8888;
        }
    </style>
</head>

<body>
    <div id="app">
        <div id="canvas-area">
            <div id="header">
                <h1>CHERENKOV DEV WORKSPACE</h1>
                <p>CLICK & DRAG ELEMENTS · RECORD ANIMATION</p>
            </div>
            <svg id="logo-svg" xmlns="http://www.w3.org/2000/svg" viewBox="-200 -200 400 400">
                <!-- Grid origin crosshair -->
                <line x1="-200" y1="0" x2="200" y2="0" stroke="rgba(255,255,255,0.05)" stroke-width="0.5" />
                <line x1="0" y1="-200" x2="0" y2="200" stroke="rgba(255,255,255,0.05)" stroke-width="0.5" />

                <!-- Logo Elements (each independently draggable) -->
                <g id="el-back-face" class="draggable" data-label="Back Face" data-ox="-20" data-oy="-20">
                    <rect x="-80" y="-80" width="160" height="160" rx="30" ry="30" fill="none"
                        stroke="rgba(255,255,255,0.45)" stroke-width="1.5" transform="translate(-20,-20)" />
                </g>

                <g id="el-connectors" class="draggable" data-label="Connectors">
                    <!-- 4 diagonal connecting lines from front corners to back corners -->
                    <line x1="58" y1="-58" x2="38" y2="-78" stroke="rgba(255,255,255,0.35)" stroke-width="1.2" />
                    <line x1="-58" y1="-58" x2="-78" y2="-78" stroke="rgba(255,255,255,0.35)" stroke-width="1.2" />
                    <line x1="58" y1="58" x2="38" y2="38" stroke="rgba(255,255,255,0.35)" stroke-width="1.2" />
                    <line x1="-58" y1="58" x2="-78" y2="38" stroke="rgba(255,255,255,0.35)" stroke-width="1.2" />
                </g>

                <g id="el-front-face" class="draggable" data-label="Front Face">
                    <rect x="-60" y="-60" width="120" height="120" rx="24" ry="24" fill="none"
                        stroke="rgba(255,255,255,0.85)" stroke-width="1.8" />
                </g>

                <g id="el-sphere" class="draggable" data-label="Cherenkov Sphere">
                    <circle cx="0" cy="0" r="22" fill="rgba(190,223,246,0.2)" stroke="rgba(190,223,246,0.7)"
                        stroke-width="1.5" />
                    <circle cx="0" cy="0" r="22" fill="url(#sphereGradient)" opacity="0.6" />
                </g>

                <g id="el-outer-circle" class="draggable" data-label="Outer Circle">
                    <circle cx="60" cy="100" r="50" fill="none" stroke="rgba(255,255,255,0.65)" stroke-width="1.5" />
                </g>

                <defs>
                    <radialGradient id="sphereGradient" cx="40%" cy="35%">
                        <stop offset="0%" stop-color="rgba(200,235,255,0.8)" />
                        <stop offset="100%" stop-color="rgba(100,180,255,0.1)" />
                    </radialGradient>
                </defs>
            </svg>
        </div>

        <div id="sidebar">
            <h2>Elements</h2>
            <div id="element-list"></div>

            <h2>Transform</h2>
            <div class="controls-section" id="transform-controls">
                <div class="control-row">
                    <label>X</label>
                    <input type="range" id="ctrl-x" min="-150" max="150" value="0">
                    <span class="val" id="val-x">0</span>
                </div>
                <div class="control-row">
                    <label>Y</label>
                    <input type="range" id="ctrl-y" min="-150" max="150" value="0">
                    <span class="val" id="val-y">0</span>
                </div>
                <div class="control-row">
                    <label>Rotate</label>
                    <input type="range" id="ctrl-r" min="-180" max="180" value="0">
                    <span class="val" id="val-r">0°</span>
                </div>
                <div class="control-row">
                    <label>Scale</label>
                    <input type="range" id="ctrl-s" min="20" max="300" value="100">
                    <span class="val" id="val-s">1.0</span>
                </div>
                <div class="control-row">
                    <label>Opacity</label>
                    <input type="range" id="ctrl-o" min="0" max="100" value="100">
                    <span class="val" id="val-o">1.0</span>
                </div>
            </div>

            <h2>Animation</h2>
            <div id="recording-panel">
                <button class="btn" id="btn-record">⏺ Record</button>
                <button class="btn" id="btn-keyframe">◆ Add Keyframe</button>
                <button class="btn primary" id="btn-play">▶ Play</button>
                <button class="btn danger" id="btn-reset">↺ Reset</button>
                <button class="btn" id="btn-export">⬇ Export CSS</button>

                <div id="timeline">
                    <div id="timeline-bar"></div>
                </div>
                <div id="frame-count">0 keyframes · 0ms</div>
            </div>
        </div>
    </div>

    <script>
        // ─── State ───────────────────────────────────────────────
        const elements = {};
        const keyframes = []; // Array of { time, states: { elId: {x,y,r,s,o} } }
        let isRecording = false;
        let recordStartTime = 0;
        let selectedId = null;
        let isDragging = false;
        let dragStart = { x: 0, y: 0 };
        let elStart = { x: 0, y: 0 };

        // ─── Initialize Elements ─────────────────────────────────
        document.querySelectorAll('.draggable').forEach(el => {
            const id = el.id;
            elements[id] = {
                el,
                label: el.dataset.label,
                x: 0, y: 0, r: 0, s: 1, o: 1
            };
        });

        // ─── Build Element List ──────────────────────────────────
        const listContainer = document.getElementById('element-list');
        for (const [id, data] of Object.entries(elements)) {
            const item = document.createElement('div');
            item.className = 'element-item';
            item.dataset.id = id;
            item.innerHTML = `
                <div class="label">${data.label}</div>
                <div class="coords" id="coords-${id}">x:0 y:0 r:0° s:1.0</div>
            `;
            item.addEventListener('click', () => selectElement(id));
            listContainer.appendChild(item);
        }

        // ─── Selection ───────────────────────────────────────────
        function selectElement(id) {
            selectedId = id;
            // Update UI
            document.querySelectorAll('.element-item').forEach(el => el.classList.remove('selected'));
            document.querySelectorAll('.draggable').forEach(el => el.classList.remove('selected-el'));

            const item = document.querySelector(`.element-item[data-id="${id}"]`);
            if (item) item.classList.add('selected');
            elements[id].el.classList.add('selected-el');

            // Update sliders
            const d = elements[id];
            document.getElementById('ctrl-x').value = d.x;
            document.getElementById('ctrl-y').value = d.y;
            document.getElementById('ctrl-r').value = d.r;
            document.getElementById('ctrl-s').value = d.s * 100;
            document.getElementById('ctrl-o').value = d.o * 100;
            updateSliderLabels();
        }

        function updateSliderLabels() {
            if (!selectedId) return;
            const d = elements[selectedId];
            document.getElementById('val-x').textContent = Math.round(d.x);
            document.getElementById('val-y').textContent = Math.round(d.y);
            document.getElementById('val-r').textContent = Math.round(d.r) + '°';
            document.getElementById('val-s').textContent = d.s.toFixed(1);
            document.getElementById('val-o').textContent = d.o.toFixed(1);

            // Update coords display
            const coordsEl = document.getElementById(`coords-${selectedId}`);
            if (coordsEl) {
                coordsEl.textContent = `x:${Math.round(d.x)} y:${Math.round(d.y)} r:${Math.round(d.r)}° s:${d.s.toFixed(1)}`;
            }
        }

        // ─── Apply Transform ─────────────────────────────────────
        function applyTransform(id) {
            const d = elements[id];
            d.el.setAttribute('transform', `translate(${d.x},${d.y}) rotate(${d.r}) scale(${d.s})`);
            d.el.style.opacity = d.o;

            const coordsEl = document.getElementById(`coords-${id}`);
            if (coordsEl) {
                coordsEl.textContent = `x:${Math.round(d.x)} y:${Math.round(d.y)} r:${Math.round(d.r)}° s:${d.s.toFixed(1)}`;
            }
        }

        // ─── SVG Coordinate Conversion ────────────────────────────
        const svg = document.getElementById('logo-svg');

        function screenToSVG(clientX, clientY) {
            const pt = svg.createSVGPoint();
            pt.x = clientX;
            pt.y = clientY;
            const svgPt = pt.matrixTransform(svg.getScreenCTM().inverse());
            return { x: svgPt.x, y: svgPt.y };
        }

        // ─── Drag Logic ──────────────────────────────────────────
        document.querySelectorAll('.draggable').forEach(el => {
            el.addEventListener('mousedown', (e) => {
                e.preventDefault();
                const id = el.id;
                selectElement(id);
                isDragging = true;
                const svgPt = screenToSVG(e.clientX, e.clientY);
                dragStart = { x: svgPt.x, y: svgPt.y };
                elStart = { x: elements[id].x, y: elements[id].y };
            });
        });

        document.addEventListener('mousemove', (e) => {
            if (!isDragging || !selectedId) return;
            const svgPt = screenToSVG(e.clientX, e.clientY);
            elements[selectedId].x = elStart.x + (svgPt.x - dragStart.x);
            elements[selectedId].y = elStart.y + (svgPt.y - dragStart.y);
            applyTransform(selectedId);
            updateSliderLabels();

            // Update sliders too
            document.getElementById('ctrl-x').value = elements[selectedId].x;
            document.getElementById('ctrl-y').value = elements[selectedId].y;
        });

        document.addEventListener('mouseup', () => {
            isDragging = false;
        });

        // ─── Slider Controls ─────────────────────────────────────
        document.getElementById('ctrl-x').addEventListener('input', (e) => {
            if (!selectedId) return;
            elements[selectedId].x = parseFloat(e.target.value);
            applyTransform(selectedId);
            updateSliderLabels();
        });
        document.getElementById('ctrl-y').addEventListener('input', (e) => {
            if (!selectedId) return;
            elements[selectedId].y = parseFloat(e.target.value);
            applyTransform(selectedId);
            updateSliderLabels();
        });
        document.getElementById('ctrl-r').addEventListener('input', (e) => {
            if (!selectedId) return;
            elements[selectedId].r = parseFloat(e.target.value);
            applyTransform(selectedId);
            updateSliderLabels();
        });
        document.getElementById('ctrl-s').addEventListener('input', (e) => {
            if (!selectedId) return;
            elements[selectedId].s = parseFloat(e.target.value) / 100;
            applyTransform(selectedId);
            updateSliderLabels();
        });
        document.getElementById('ctrl-o').addEventListener('input', (e) => {
            if (!selectedId) return;
            elements[selectedId].o = parseFloat(e.target.value) / 100;
            applyTransform(selectedId);
            updateSliderLabels();
        });

        // ─── Recording ──────────────────────────────────────────
        document.getElementById('btn-record').addEventListener('click', () => {
            isRecording = !isRecording;
            const btn = document.getElementById('btn-record');
            if (isRecording) {
                btn.classList.add('recording');
                btn.textContent = '⏹ Stop';
                recordStartTime = performance.now();
                keyframes.length = 0;
                addKeyframe(); // initial state
            } else {
                btn.classList.remove('recording');
                btn.textContent = '⏺ Record';
            }
        });

        document.getElementById('btn-keyframe').addEventListener('click', addKeyframe);

        function addKeyframe() {
            const time = isRecording ? performance.now() - recordStartTime : (keyframes.length > 0 ? keyframes[keyframes.length - 1].time + 500 : 0);
            const states = {};
            for (const [id, d] of Object.entries(elements)) {
                states[id] = { x: d.x, y: d.y, r: d.r, s: d.s, o: d.o };
            }
            keyframes.push({ time, states });
            updateTimeline();
        }

        function updateTimeline() {
            const timeline = document.getElementById('timeline');
            // Clear old dots
            timeline.querySelectorAll('.keyframe-dot').forEach(d => d.remove());

            if (keyframes.length === 0) return;
            const totalTime = keyframes[keyframes.length - 1].time || 1;

            keyframes.forEach((kf, i) => {
                const dot = document.createElement('div');
                dot.className = 'keyframe-dot';
                dot.style.left = (kf.time / totalTime * 100) + '%';
                dot.title = `${Math.round(kf.time)}ms`;
                dot.addEventListener('click', () => applyKeyframe(i));
                timeline.appendChild(dot);
            });

            document.getElementById('frame-count').textContent =
                `${keyframes.length} keyframes · ${Math.round(totalTime)}ms`;
        }

        function applyKeyframe(index) {
            const kf = keyframes[index];
            for (const [id, state] of Object.entries(kf.states)) {
                Object.assign(elements[id], state);
                applyTransform(id);
            }
            if (selectedId) {
                selectElement(selectedId);
            }
        }

        // ─── Playback ───────────────────────────────────────────
        document.getElementById('btn-play').addEventListener('click', () => {
            if (keyframes.length < 2) return;
            playAnimation();
        });

        function playAnimation() {
            const totalTime = keyframes[keyframes.length - 1].time;
            const startTime = performance.now();
            const bar = document.getElementById('timeline-bar');

            function tick() {
                const elapsed = performance.now() - startTime;
                const progress = Math.min(elapsed / totalTime, 1);
                bar.style.width = (progress * 100) + '%';

                // Find which two keyframes we're between
                let kfA = keyframes[0], kfB = keyframes[1];
                for (let i = 0; i < keyframes.length - 1; i++) {
                    if (elapsed >= keyframes[i].time && elapsed <= keyframes[i + 1].time) {
                        kfA = keyframes[i];
                        kfB = keyframes[i + 1];
                        break;
                    }
                }

                // Interpolate
                const segDuration = kfB.time - kfA.time || 1;
                const t = Math.min((elapsed - kfA.time) / segDuration, 1);
                const eased = t < 0.5 ? 2 * t * t : -1 + (4 - 2 * t) * t; // ease in-out

                for (const id of Object.keys(elements)) {
                    const a = kfA.states[id];
                    const b = kfB.states[id];
                    if (!a || !b) continue;
                    elements[id].x = a.x + (b.x - a.x) * eased;
                    elements[id].y = a.y + (b.y - a.y) * eased;
                    elements[id].r = a.r + (b.r - a.r) * eased;
                    elements[id].s = a.s + (b.s - a.s) * eased;
                    elements[id].o = a.o + (b.o - a.o) * eased;
                    applyTransform(id);
                }

                if (progress < 1) {
                    requestAnimationFrame(tick);
                } else {
                    bar.style.width = '0%';
                }
            }
            requestAnimationFrame(tick);
        }

        // ─── Reset ───────────────────────────────────────────────
        document.getElementById('btn-reset').addEventListener('click', () => {
            for (const [id, d] of Object.entries(elements)) {
                d.x = 0; d.y = 0; d.r = 0; d.s = 1; d.o = 1;
                applyTransform(id);
            }
            keyframes.length = 0;
            updateTimeline();
            if (selectedId) selectElement(selectedId);
        });

        // ─── Export CSS ──────────────────────────────────────────
        document.getElementById('btn-export').addEventListener('click', () => {
            if (keyframes.length < 2) { alert('Add at least 2 keyframes first!'); return; }
            const totalTime = keyframes[keyframes.length - 1].time;
            let css = `/* Cherenkov Logo Animation — ${Math.round(totalTime)}ms */\n\n`;

            for (const id of Object.keys(elements)) {
                const label = elements[id].label.replace(/\s+/g, '-').toLowerCase();
                css += `@keyframes ${label}-anim {\n`;

                for (const kf of keyframes) {
                    const pct = Math.round((kf.time / totalTime) * 100);
                    const s = kf.states[id];
                    css += `  ${pct}% {\n`;
                    css += `    transform: translate(${s.x.toFixed(1)}px, ${s.y.toFixed(1)}px) rotate(${s.r.toFixed(1)}deg) scale(${s.s.toFixed(2)});\n`;
                    css += `    opacity: ${s.o.toFixed(2)};\n`;
                    css += `  }\n`;
                }
                css += `}\n\n`;
                css += `#${id} {\n  animation: ${label}-anim ${Math.round(totalTime)}ms ease-in-out infinite;\n}\n\n`;
            }

            // Copy to clipboard
            navigator.clipboard.writeText(css).then(() => {
                const btn = document.getElementById('btn-export');
                btn.textContent = '✓ Copied!';
                setTimeout(() => btn.textContent = '⬇ Export CSS', 2000);
            }).catch(() => {
                // Fallback: download as file
                const blob = new Blob([css], { type: 'text/css' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = 'cherenkov-animation.css';
                a.click();
            });
        });

        // ─── Select first element by default ─────────────────────
        selectElement('el-front-face');
    </script>
</body>

</html>
