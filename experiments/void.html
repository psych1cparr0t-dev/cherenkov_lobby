<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>VOID</title>
<style>
* { margin:0; padding:0; box-sizing:border-box }
body { background:#000; overflow:hidden; cursor:none }
canvas { display:block }
#hud { position:fixed; top:24px; left:50%; transform:translateX(-50%); font:11px/1 'Courier New',monospace; color:#4a6cf7; letter-spacing:.35em; text-transform:uppercase }
#msg { position:fixed; top:50%; left:50%; transform:translate(-50%,-50%); font:11px/2.2 'Courier New',monospace; color:#4a6cf7; letter-spacing:.4em; text-align:center; text-transform:uppercase }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud">score: <span id="s">0</span></div>
<div id="msg">MOVE TO BEGIN<br><span style="opacity:.4;font-size:10px">avoid the wells · collect light</span></div>
<script>
const c = document.getElementById('c'), x = c.getContext('2d');
const W = c.width = innerWidth, H = c.height = innerHeight;
const msg = document.getElementById('msg'), scoreEl = document.getElementById('s');
let p = {x:W/2, y:H/2}, score = 0, alive = true, started = false;

const wells = Array.from({length:4}, (_,i) => ({
  x: W*(.2+.2*(i%2)+Math.random()*.1), y: H*(.2+.2*(i>>1)+Math.random()*.1),
  vx: (Math.random()-.5)*1.4, vy: (Math.random()-.5)*1.4,
  r: 26 + Math.random()*16
}));

let dots = Array.from({length:7}, () => ({x:Math.random()*W, y:Math.random()*H}));

onmousemove = e => { p.x=e.clientX; p.y=e.clientY; if(!started){started=true;msg.style.display='none';} };

const dist = (a,b) => Math.hypot(a.x-b.x, a.y-b.y);
const glow = (col,blur) => { x.shadowColor=col; x.shadowBlur=blur; };
const spawnDot = () => dots.push({x:40+Math.random()*(W-80), y:40+Math.random()*(H-80)});

(function loop() {
  requestAnimationFrame(loop);
  x.fillStyle = 'rgba(0,0,0,.16)';
  x.fillRect(0,0,W,H);

  for (const w of wells) {
    w.x += w.vx; w.y += w.vy;
    if (w.x<w.r||w.x>W-w.r) w.vx*=-1;
    if (w.y<w.r||w.y>H-w.r) w.vy*=-1;

    // Pulse rings
    [2.8,1.9,1].forEach((s,i) => {
      glow('#4a6cf7', 28);
      x.beginPath(); x.arc(w.x,w.y,w.r*s,0,6.28);
      x.strokeStyle = `rgba(74,108,247,${[.1,.2,.35][i]})`; x.lineWidth=1.2; x.stroke();
    });
    // Core gradient
    const gr = x.createRadialGradient(w.x,w.y,0,w.x,w.y,w.r);
    gr.addColorStop(0,'rgba(160,180,255,.95)'); gr.addColorStop(1,'rgba(74,108,247,0)');
    x.beginPath(); x.arc(w.x,w.y,w.r,0,6.28); x.fillStyle=gr; x.fill();

    if (alive && started && dist(p,w) < w.r+5) {
      alive=false;
      msg.innerHTML=`CAPTURED<br><span style="opacity:.4;font-size:10px">score: ${score} — refresh to try again</span>`;
      msg.style.display='';
    }
  }

  // Dots
  for (let i=dots.length-1; i>=0; i--) {
    const d=dots[i], pulse = .7+.3*Math.sin(Date.now()*.003+i);
    glow('#c8dcff', 18*pulse);
    x.beginPath(); x.arc(d.x,d.y,3*pulse,0,6.28);
    x.fillStyle='rgba(220,235,255,0.9)'; x.fill();
    if (alive && dist(p,d)<11) { dots.splice(i,1); scoreEl.textContent=++score; setTimeout(spawnDot,600); }
  }

  // Player
  if (started) {
    glow(alive?'#c8e0ff':'#ff4466', 36);
    x.beginPath(); x.arc(p.x,p.y,4,0,6.28);
    x.fillStyle=alive?'#e8f2ff':'#ff4466'; x.fill();
    x.shadowBlur=0;
  }
})();
</script>
</body>
</html>
