<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Cherenkov — A multidisciplinary design firm.">
  <meta name="theme-color" content="#f5f5f5">
  <title>Cherenkov</title>
  
  <link rel="icon" type="image/svg+xml" href="assets/logos/cherenkov_logo_web.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles/index.css">
</head>

<body>
  <div id="landing-page">

    <!-- Layer 1: Liminal Veil Mosaic -->
    <canvas id="veil-canvas"></canvas>

    <!-- Layer 2: Top Corner Navigation -->
    <div class="top-nav">
      <a href="mailto:max@cherenkov.industries" class="nav-link" id="nav-contact">Contact</a>
      <a href="https://mercury.com" target="_blank" class="nav-link" id="nav-fund">Fund</a>
    </div>

    <!-- Layer 3: Background Patterns (fade out on reveal) -->
    <div class="background-pattern pattern-1"></div>
    <div class="background-pattern pattern-2"></div>

    <!-- Layer 4: Main Wordmark -->
    <div class="wordmark-container">
      <h1 class="wordmark" id="wordmark">
        <span class="letter">C</span>
        <span class="letter">H</span>
        <span class="letter">E</span>
        <span class="letter">R</span>
        <span class="letter">E</span>
        <span class="letter">N</span>
        <span class="letter">K</span>
        <span class="letter">O</span>
        <span class="letter">V</span>
      </h1>
      <p class="wordmark-sub" id="wordmark-sub">Inc.</p>
    </div>

  </div>

  <!-- Modular Scripts -->
  <script src="scripts/coordinator.js"></script>
  <script src="scripts/reveal.js"></script>
  <script src="scripts/veil_mosaic.js"></script>

</body>

</html>
