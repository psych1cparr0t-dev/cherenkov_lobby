<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  
  <!-- SEO & Brand -->
  <title>Cherenkov</title>
  <meta name="description" content="Cherenkov.">
  <meta name="theme-color" content="#f5f5f5">
  
  <!-- Open Graph / Social -->
  <meta property="og:title" content="Cherenkov">
  <meta property="og:description" content="Applied Research & Experimental Strategy.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://cherenkov.industries">
  
  <link rel="icon" type="image/svg+xml" href="assets/logos/cherenkov_logo_web.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles/index.css">
</head>

<body>
  <div id="landing-page">

    <!-- Layer 1: Liminal Veil Mosaic -->
    <canvas id="veil-canvas"></canvas>

    <!-- Layer 2: Strategic Navigation -->
    <nav class="top-nav" aria-label="Main Navigation">
      <div class="nav-group-right">
        <a href="https://mercury.com" target="_blank" class="nav-link" id="nav-capital">Capital</a>
      </div>
    </nav>


    <!-- Layer 3: Background Patterns (Autostereogram) -->
    <div class="background-pattern pattern-1"></div>
    <div class="background-pattern pattern-2"></div>
    <div class="background-pattern pattern-3"></div>
    <div class="background-pattern pattern-4"></div>

    <!-- Layer 3.5: Transition Overlay -->
    <div id="fade-overlay"></div>


    <!-- Layer 4: Main Wordmark -->
    <div class="wordmark-container">
      <h1 class="wordmark" id="wordmark">
        <span class="letter">C</span>
        <span class="letter">H</span>
        <span class="letter">E</span>
        <span class="letter">R</span>
        <span class="letter">E</span>
        <span class="letter">N</span>
        <span class="letter">K</span>
        <span class="letter">O</span>
        <span class="letter">V</span>
      </h1>
      <p class="wordmark-sub" id="wordmark-sub">Inc.</p>
    </div>

  </div>

  <!-- Framework -->
  <script src="scripts/coordinator.js"></script>
  <script src="scripts/reveal.js"></script>
  <script src="scripts/veil_mosaic.js"></script>

</body>

</html>
