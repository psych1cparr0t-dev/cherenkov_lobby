<head>
  <meta charset="UTF-8">

  <!-- SEO & Brand -->
  <title>Cherenkov</title>
  <meta name="description" content="Cherenkov.">
  <meta name="theme-color" content="#f5f5f5">
  
  <!-- Open Graph / Social -->
  <meta property="og:title" content="Cherenkov">
  <meta property="og:description" content="Applied Research & Experimental Strategy.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://cherenkov.industries">

<body>
  <div id="landing-page">

    <!-- Layer 0: Glassmorphism Showcase Dropdown -->
    <div id="top-glass-bar">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" class="feather feather-chevron-down glass-bar-arrow">
        <polyline points="6 9 12 15 18 9"></polyline>
      </svg>
      <div class="showcase-content">
        <a href="#" class="showcase-item">
          <span class="showcase-title">Liminal Veil Engine</span>
          <span class="showcase-arrow">→</span>
          <span class="showcase-desc">WebGL / 2026</span>
        </a>
        <a href="#" class="showcase-item">
          <span class="showcase-title">Project Alpha</span>
          <span class="showcase-arrow">→</span>
          <span class="showcase-desc">Architecture</span>
        </a>
        <a href="#" class="showcase-item">
          <span class="showcase-title">System 9</span>
          <span class="showcase-arrow">→</span>
          <span class="showcase-desc">Experimental</span>
        </a>
      </div>
    </div>

    <!-- Layer 1: Liminal Veil Native Video -->
    <video id="veil-video-a" class="veil-video" muted playsinline></video>
    <video id="veil-video-b" class="veil-video" muted playsinline></video>


    <!-- Layer 2: Bottom Contact Icon -->
    <div class="bottom-contact-container">
      <a href="mailto:max@cherenkov.industries" class="contact-icon" id="contact-link" aria-label="Contact">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" class="feather feather-map-pin">
          <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"></path>
          <circle cx="12" cy="10" r="3"></circle>
        </svg>
      </a>
    </div>


    <!-- Layer 3: Background Patterns (Removed) -->

    <!-- Layer 4: Main Wordmark -->
    <div class="wordmark-container">
      <h1 class="wordmark" id="wordmark">
        <span class="letter">C</span>
        <span class="letter">H</span>
        <span class="letter">E</span>
        <span class="letter">R</span>
        <span class="letter">E</span>
        <span class="letter">N</span>
        <span class="letter">K</span>
        <span class="letter">O</span>
        <span class="letter">V</span>
      </h1>
      <p class="wordmark-sub" id="wordmark-sub">Inc.</p>
    </div>

  </div>

  <!-- Framework with Cache Busting -->

  <script src="scripts/contact_modal.js?v=1"></script>
  <script src="scripts/pin_to_video.js?v=1"></script>
  <script src="scripts/showcase_dropdown.js?v=1"></script>
